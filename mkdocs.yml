site_name: Studies De Jure
site_url: https://studies-de-jure.readthedocs.io/

nav:
  - Home: index.md  
  - Courses:
    - Introduction to Courts:
      - intro/index.md
      - intro/sources.md
    - Business Law:
      - Chapter 1:
        - bus-law/ch1/index.md
        - Why Should I Care About The Law?: bus-law/ch1/1.1why.md
        - What Is Law and What Functions Does It Serve?: bus-law/ch1/1.2what.md
        - Modern Legal Systems of the World: bus-law/ch1/1.3modern.md
theme: 
  name: material
  custom_dir: overrides
  font:
    text: Roboto
  favicon: images/favicon.png
  logo: images/logo1.png
  palette:  
  - media: "(prefers-color-scheme: light)"    
    scheme: default
    primary: blue grey
    accent: blue 
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode  
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: blue grey
    accent: blue
    toggle:
      icon: material/brightness-4
      name: Switch to light mode  
  features:
    - header.autohide
    - navigation.top
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer   
    - toc.follow
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    
  icon:
    admonition:
      abstract: fontawesome/solid/book
      tip: octicons/pin-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      quote: fontawesome/solid/quote-left

markdown_extensions:
  - attr_list
  - footnotes
  - abbr
  - def_list
  - md_in_html
  - toc:
      toc_depth: 4
      permalink: true
      permalink_title: Anchor link to this section for reference

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.tabbed:
      alternate_style: true

  - admonition
  - pymdownx.details
  - pymdownx.betterem
  - pymdownx.blocks.caption
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/glossary.md
  - pymdownx.critic
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

watch:
  - includes

plugins:
  - search

extra_css:
  - stylesheets/extra.css
  - stylesheets/glossary.css
  - stylesheets/overlay.css
extra_javascript:
  - javascripts/extra.js
  - javascripts/glossary_data.js
  - javascripts/glossary_auto.js
  - javascripts/overlay.js
