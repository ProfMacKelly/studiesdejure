{% extends "base.html" %}

{% block content %}
  {{ super() }}

  <!-- Global Link Preview Popover -->
  <div id="previewModal" class="sdj-preview" aria-hidden="true">
    <div class="sdj-preview__panel" role="dialog" aria-label="Link preview">
      <button id="previewClose" type="button" class="sdj-preview__close" aria-label="Close preview">×</button>
      <iframe id="previewFrame" class="sdj-preview__frame" src="" loading="lazy"></iframe>
    </div>
  </div>
{% endblock %}
