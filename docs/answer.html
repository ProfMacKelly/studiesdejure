<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reveal Answer</title>
  <style>
    .answer-button {
      font-weight: bold;
      color: blue;
      padding: 5px 10px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    .hidden-answer {
      display: none;
    }
  </style>
</head>
<body>

  <p>Why is the sky blue?</p>
  <span class="answer-button" onclick="revealAnswer(this)">Answer</span>
  <p class="hidden-answer">The sky appears blue due to Rayleigh scattering.</p>

  <script>
    function revealAnswer(element) {
      let answerElement = element.nextElementSibling;

      if (answerElement && answerElement.classList.contains("hidden-answer")) {
        if (answerElement.style.display === "none" || answerElement.style.display === "") {
          answerElement.style.display = "block";
          element.textContent = "Hide Answer";
        } else {
          answerElement.style.display = "none";
          element.textContent = "Answer";
        }
      }
    }
  </script>

</body>
</html>
