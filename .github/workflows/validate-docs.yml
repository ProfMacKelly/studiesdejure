name: Validate MkDocs Build

on:
  pull_request:
    branches: [experiment]
  push:
    branches: [experiment]

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yamllint

      - name: 📘 Lint mkdocs.yml
        run: |
          echo "Linting mkdocs.yml with yamllint..."
          yamllint mkdocs.yml

      - name: 🧪 Build MkDocs Site
        run: |
          echo "Building site with mkdocs build --strict..."
          mkdocs build --strict
